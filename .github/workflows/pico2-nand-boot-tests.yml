name: Pico 2 NAND candidate and EP0 transport tests
on:
  push:
    paths:
      - 'standalone/pico2/**'
      - 'tests/test_nand_boot.py'
      - 'tests/test_nand_transport.py'
      - 'tests/test_pico_nand_integration.py'
      - 'tests/test_iboot_audit.py'
      - 'tests/test_pico_preboot_stage.py'
      - 'tests/test_pico_board_preflight.py'
      - 'tests/test_shutdown_diagnostics.py'
      - '.github/workflows/pico2-nand-boot-tests.yml'
  pull_request:
    paths:
      - 'standalone/pico2/**'
      - 'tests/test_nand_boot.py'
      - 'tests/test_nand_transport.py'
      - 'tests/test_pico_nand_integration.py'
      - 'tests/test_iboot_audit.py'
      - 'tests/test_pico_preboot_stage.py'
      - 'tests/test_pico_board_preflight.py'
      - 'tests/test_shutdown_diagnostics.py'
      - '.github/workflows/pico2-nand-boot-tests.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pyimg4==0.8.9 unicorn==2.1.4
      - name: Binary analysis and configuration resolution tests
        run: python3 -m unittest discover -s tests -p 'test_iboot_audit.py' -v
      - name: Execute ARM64 wrappers and validate private export behavior
        run: python3 -m unittest discover -s tests -p 'test_nand_boot.py' -v
      - name: Compile and execute portable USB control transport tests
        run: python3 -m unittest discover -s tests -p 'test_nand_transport.py' -v
      - name: Validate optional isolated Preboot staging with mocked SSH
        run: python3 -m unittest discover -s tests -p 'test_pico_preboot_stage.py' -v
      - name: Reject invalid or oversized board-specific UF2 images
        run: python3 -m unittest discover -s tests -p 'test_pico_board_preflight.py' -v
      - name: Validate private read-only panic/shutdown diagnostics
        run: python3 -m unittest discover -s tests -p 'test_shutdown_diagnostics.py' -v
      - name: Validate source integration and private header isolation
        run: python3 -m unittest discover -s tests -p 'test_pico_nand_integration.py' -v
